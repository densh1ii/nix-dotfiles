
[window]
opacity = 0.93
padding = {x = 14, y = 14}
decorations = "full"

[font]
size = 12.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[cursor]
style = { shape = "Block", blinking = "On" }
blink_interval = 600

[colors.primary]
background         = '#0d0d0d'
foreground          = '#e0e0e0'
dim_foreground      = '#a0a0a0'
bright_foreground   = '#ffffff'
 
[colors.cursor]
text   = '#0d0d0d'
cursor = '#e0e0e0'
 
[colors.vi_mode_cursor]
text   = '#0d0d0d'
cursor = '#808080'
 
[colors.selection]
text       = '#0d0d0d'
background = '#a0a0a0'
 
[colors.normal]
black   = '#0d0d0d'
red     = '#5c5c5c'
green   = '#6e6e6e'
yellow  = '#808080'
blue    = '#929292'
magenta = '#a4a4a4'
cyan    = '#b6b6b6'
white   = '#c8c8c8'
 
[colors.bright]
black   = '#4d4d4d'
red     = '#707070'
green   = '#828282'
yellow  = '#949494'
blue    = '#a6a6a6'
magenta = '#b8b8b8'
cyan    = '#cacaca'
white   = '#ffffff'
 
[colors.dim]
black   = '#000000'
red     = '#454545'
green   = '#535353'
yellow  = '#616161'
blue    = '#6f6f6f'
magenta = '#7d7d7d'
cyan    = '#8b8b8b'
white   = '#999999'

