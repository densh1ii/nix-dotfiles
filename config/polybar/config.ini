; =============================================================================
;  Tokyo Night (Night) Polybar Config
;  Place at ~/.config/polybar/config.ini
;  Launch with: polybar main &
; =============================================================================

[colors]
bg          = #1a1b26
bg-alt      = #16161e
bg-highlight = #292e42
fg          = #c0caf5
fg-alt      = #a9b1d6
fg-gutter   = #3b4261
comment     = #565f89
selection   = #33467c

blue        = #7aa2f7
cyan        = #7dcfff
teal        = #1abc9c
green       = #9ece6a
magenta     = #bb9af7
purple      = #9d7cd8
orange      = #ff9e64
yellow      = #e0af68
red         = #f7768e
red-dim     = #db4b4b

transparent = #00000000

; =============================================================================
[bar/main]
width = 100%
height = 28px
offset-x = 0
offset-y = 0
radius = 0
fixed-center = true

background = ${colors.bg}
foreground = ${colors.fg}

line-size = 3
line-color = ${colors.blue}

border-size = 0
border-color = ${colors.transparent}

padding-left = 1
padding-right = 1
module-margin-left = 0
module-margin-right = 0

font-0 = "JetBrainsMono Nerd Font:size=10;3"
font-1 = "JetBrainsMono Nerd Font:size=14;4"

modules-left = i3
modules-center = date
modules-right = pulseaudio memory cpu wlan eth battery tray

cursor-click = pointer
enable-ipc = true

; =============================================================================
;  Workspaces (i3wm). If you use bspwm instead, swap this module for bspwm.
; =============================================================================
[module/tray]
type = internal/tray
format-margin = 4
tray-spacing = 4
tray-background = ${colors.bg}

; =============================================================================
[module/i3]
type = internal/i3
format = <label-state> <label-mode>
format-prefix = "  "
format-prefix-foreground = ${colors.blue}
index-sort = true
wrapping-scroll = false

label-mode = %mode%
label-mode-padding = 2
label-mode-background = ${colors.magenta}
label-mode-foreground = ${colors.bg}

label-focused = %index%
label-focused-background = ${colors.bg-highlight}
label-focused-foreground = ${colors.blue}
label-focused-underline = ${colors.blue}
label-focused-padding = 2

label-unfocused = %index%
label-unfocused-foreground = ${colors.fg-alt}
label-unfocused-padding = 2

label-visible = %index%
label-visible-foreground = ${colors.fg-alt}
label-visible-padding = 2

label-urgent = %index%
label-urgent-background = ${colors.red}
label-urgent-foreground = ${colors.bg}
label-urgent-padding = 2

; =============================================================================
[module/date]
type = internal/date
interval = 1

date = %H:%M
date-alt = %A, %d %B %Y  %H:%M:%S

label = %date%
label-foreground = ${colors.cyan}

format-prefix = "  "
format-prefix-foreground = ${colors.teal}
format-background = ${colors.bg-highlight}
format-underline = ${colors.cyan}
format-padding = 1

; =============================================================================
[module/cpu]
type = internal/cpu
interval = 2
format = <label>
format-background = ${colors.bg-highlight}
format-underline = ${colors.orange}
format-padding = 1
label = %percentage%%
label-foreground = ${colors.orange}
format-prefix = "  "
format-prefix-foreground = ${colors.orange}

; =============================================================================
[module/memory]
type = internal/memory
interval = 2
format = <label>
format-background = ${colors.bg-highlight}
format-underline = ${colors.purple}
format-padding = 1
label = %percentage_used%%
label-foreground = ${colors.purple}
format-prefix = "  "
format-prefix-foreground = ${colors.purple}

; =============================================================================
[module/wlan]
type = internal/network
interface-type = wireless
interval = 3.0

format-connected = <label-connected>
format-connected-background = ${colors.bg-highlight}
format-connected-underline = ${colors.green}
format-connected-prefix = "  "
format-connected-prefix-foreground = ${colors.green}
format-connected-padding = 1
label-connected = %essid%
label-connected-foreground = ${colors.green}

format-disconnected = <label-disconnected>
format-disconnected-prefix = "  "
format-disconnected-prefix-foreground = ${colors.comment}
label-disconnected = disconnected
label-disconnected-foreground = ${colors.comment}
format-disconnected-padding = 1

; =============================================================================
[module/eth]
type = internal/network
interface-type = wired
interval = 3.0

format-connected = <label-connected>
format-connected-background = ${colors.bg-highlight}
format-connected-underline = ${colors.teal}
format-connected-prefix = "  "
format-connected-prefix-foreground = ${colors.teal}
format-connected-padding = 1
label-connected = %local_ip%
label-connected-foreground = ${colors.teal}

format-disconnected =

; =============================================================================
[module/battery]
type = internal/battery
full-at = 98
low-at = 15
battery = BAT1
adapter = AC
poll-interval = 5

format-charging = <animation-charging> <label-charging>
format-charging-prefix = "  "
format-charging-prefix-foreground = ${colors.yellow}
format-charging-foreground = ${colors.yellow}
format-charging-background = ${colors.bg-highlight}
format-charging-underline = ${colors.yellow}
format-charging-padding = 1

format-discharging = <ramp-capacity> <label-discharging>
format-discharging-foreground = ${colors.fg}
format-discharging-background = ${colors.bg-highlight}
format-discharging-underline = ${colors.blue}
format-discharging-padding = 1

format-full = <ramp-capacity> <label-full>
format-full-foreground = ${colors.green}
format-full-background = ${colors.bg-highlight}
format-full-underline = ${colors.green}
format-full-padding = 1

format-low = <label-low>
format-low-foreground = ${colors.red}
format-low-background = ${colors.bg-highlight}
format-low-underline = ${colors.red}
format-low-padding = 1
label-low = ! low battery
animation-low-0 = !
animation-low-1 = " "
animation-low-framerate = 500

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 

animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-framerate = 750

; =============================================================================
[module/pulseaudio]
type = internal/pulseaudio

format-volume = <ramp-volume> <label-volume>
format-volume-background = ${colors.bg-highlight}
format-volume-underline = ${colors.magenta}
format-volume-padding = 2
label-volume = %percentage%%
label-volume-foreground = ${colors.magenta}

format-muted = <label-muted>
format-muted-background = ${colors.bg-highlight}
format-muted-foreground = ${colors.comment}
format-muted-padding = 1
label-muted =   muted

ramp-volume-foreground = ${colors.magenta}
ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 

click-right = pavucontrol

; =============================================================================
[settings]
screenchange-reload = true
pseudo-transparency = true
