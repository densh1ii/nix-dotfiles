; ============================================================
; Monochrome Polybar config
; Save as ~/.config/polybar/config.ini
; Launch with: polybar main
; ============================================================

[colors]
background     = #0d0d0d
background-alt  = #1a1a1a
foreground      = #e0e0e0
foreground-alt  = #a0a0a0
primary         = #ffffff
secondary       = #808080
alert           = #4d4d4d
disabled        = #4d4d4d
underline       = #666666
border          = #333333

[bar/main]
width = 100%
height = 28pt
radius = 0

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2pt

border-size = 0pt
border-color = ${colors.border}

padding-left = 1
padding-right = 1

module-margin = 1

separator = "  |  "
separator-foreground = ${colors.disabled}

font-0 = "JetBrainsMono Nerd Font:size=10;2"
font-1 = "JetBrainsMono Nerd Font:size=14;3"

modules-left = i3 xwindow
modules-center = date
modules-right = pulseaudio bluetooth wlan eth tray

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; ============================================================
; Modules
; ============================================================

[module/i3]
type = internal/i3
format = <label-state> <label-mode>
index-sort = true
wrapping-scroll = false
pin-workspaces = true

label-mode-padding = 2
label-mode-foreground = ${colors.background}
label-mode-background = ${colors.primary}

label-focused = %index%
label-focused-foreground = ${colors.background}
label-focused-background = ${colors.primary}
label-focused-underline = ${colors.underline}
label-focused-padding = 2

label-unfocused = %index%
label-unfocused-foreground = ${colors.foreground-alt}
label-unfocused-background = ${colors.background-alt}
label-unfocused-padding = 2

label-visible = %index%
label-visible-foreground = ${colors.foreground}
label-visible-background = ${colors.background-alt}
label-visible-underline = ${colors.disabled}
label-visible-padding = 2

label-urgent = %index%
label-urgent-foreground = ${colors.background}
label-urgent-background = ${colors.alert}
label-urgent-padding = 2

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%
label-foreground = ${colors.foreground-alt}

[module/date]
type = internal/date
interval = 1

date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S

label = %date%
label-foreground = ${colors.primary}

[module/wlan]
type = internal/network
interface-type = wireless
interval = 3.0

format-connected = <ramp-signal> <label-connected>
format-connected-foreground = ${colors.foreground}
label-connected = connected

format-disconnected = <label-disconnected>
format-disconnected-foreground = ${colors.disabled}
label-disconnected = disconnected

ramp-signal-0 = ▁
ramp-signal-1 = ▂
ramp-signal-2 = ▄
ramp-signal-3 = ▆
ramp-signal-4 = █
ramp-signal-foreground = ${colors.foreground-alt}

[module/eth]
type = internal/network
interface-type = wired
interval = 3.0

format-connected = <label-connected>
format-connected-foreground = ${colors.foreground}
label-connected = %ifname% %local_ip%

format-disconnected =

[module/tray]
type = internal/tray

format-margin = 8pt
tray-spacing = 8pt
tray-background = ${colors.background}

[module/bluetooth]
type = custom/script
exec = /home/denshi/nix-dotfiles/config/polybar/scripts/bluetooth.sh
interval = 5
format = <label>
format-foreground = ${colors.foreground}
click-left = blueman-manager &

[module/pulseaudio]
type = internal/pulseaudio

format-volume = <ramp-volume> <label-volume>
format-volume-foreground = ${colors.foreground}
label-volume = %percentage%%

label-muted = muted
label-muted-foreground = ${colors.disabled}

ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
ramp-volume-foreground = ${colors.foreground-alt}

click-right = pavucontrol

[settings]
screenchange-reload = true
pseudo-transparency = false
